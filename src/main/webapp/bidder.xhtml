<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:f="jakarta.faces.core"
                xmlns:h="jakarta.faces.html"
                template="/WEB-INF/layout/template.xhtml">

    <ui:define name="content">
        <h3>Bidder</h3>
        <p>Represents a user who places bids on auction items.</p>
        <h:panelGrid columns="2" columnClasses="label,value" styleClass="table-form">

            <h:outputLabel for="name" value="Name:" />
            <h:inputText id="name" value="#{bidderBean.bidder.name}" />

            <h:outputLabel for="email" value="Email:" />
            <h:inputText id="email" value="#{bidderBean.bidder.email}" />

            <h:outputLabel for="phone" value="Phone:" />
            <h:inputText id="phone" value="#{bidderBean.bidder.phone}" />
        </h:panelGrid>
        <h:inputHidden id="bidderId" 
                       value="#{bidderBean.bidder.bidderId}" />

        <h:commandButton value="Save" action="#{bidderBean.save}" styleClass="btn btn-primary mt-3" />

        <h3 class="mt-5">Bidder List</h3>
        <h:dataTable value="#{bidderBean.allBidders}" var="bidder" border="1" styleClass="table table-striped table-bordered">
            <h:column>
                <f:facet name="header">Bidder Id</f:facet>
                #{bidder.bidderId}
            </h:column>
            <h:column>
                <f:facet name="header">Name</f:facet>
                #{bidder.name}
            </h:column>
            <h:column>
                <f:facet name="header">Email</f:facet>
                #{bidder.email}
            </h:column>
            <h:column>
                <f:facet name="header">Phone</f:facet>
                #{bidder.phone}
            </h:column>
            <h:column>
                <f:facet name="header">Actions</f:facet>
                <h:commandLink value="Edit" action="#{bidderBean.edit(bidder)}" styleClass="btn btn-link p-0" />
                |
                <h:commandLink value="Delete" action="#{bidderBean.remove(bidder.bidderId)}"
                               onclick="return confirm('Delete this bidder?');" 
                               styleClass="btn btn-link p-0 text-danger" />
            </h:column>
        </h:dataTable>
    </ui:define>
</ui:composition>
